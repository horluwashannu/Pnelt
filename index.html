<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification</title>

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .verification-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .verification-box h2 {
            margin: 0 0 10px;
            font-size: 21px;
            color: #222;
        }

        .verification-box p {
            margin: 0 0 25px;
            font-size: 14px;
            color: #666;
        }

        .turnstile-container {
            display: flex;
            justify-content: center;
        }

        #continue {
            display: none;
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #continue:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="verification-box">

        <h2>Verify you are human</h2>

        <p>Complete the verification to continue.</p>

        <div class="turnstile-container">

            <div
                class="cf-turnstile"
                data-sitekey="0x4AAAAAAFwleuJ5PWk3Mbg_"
                data-theme="auto"
                data-size="normal"
                data-callback="verificationSuccess">
            </div>

        </div>

        <button id="continue" onclick="continuePage()">
            Continue
        </button>

    </div>


    <script>
        async function verificationSuccess(token) {

            try {
                const response = await fetch("tunnel.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: "cf-turnstile-response=" + encodeURIComponent(token)
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = "next.php";
                } else {
                    alert("Verification failed. Please try again.");
                }

            } catch (error) {
                console.error(error);
                alert("Unable to verify. Please try again.");
            }
        }
    </script>

</body>
</html>
